version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: inventorypro-postgres
    environment:
      POSTGRES_DB: inventorypro
      POSTGRES_USER: ipro_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipro_dev_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipro_user -d inventorypro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inventorypro-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
